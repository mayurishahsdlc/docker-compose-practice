services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: docker-practice-staging-backend

    ports:
      - "4001:4000"

    environment:
      PORT: 4000
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: dockerpractice_staging

    depends_on:
      - mongo

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: docker-practice-staging-frontend

    ports:
      - "3001:80"

    depends_on:
      - backend

    restart: unless-stopped


  mongo:
    image: mongo:7

    container_name: docker-practice-staging-mongo

    volumes:
      - staging_mongo_data:/data/db

    restart: unless-stopped


volumes:
  staging_mongo_data:
